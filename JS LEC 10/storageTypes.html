<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Local Storage</title>
  </head>
  <body>
    <h1>The Window Object</h1>
    <h2>The localStorage Property</h2>

    <p><button onclick="clickCounter()" type="button">Click me!</button></p>

    <p>Number of clicks: <span id="demo"></span></p>

    <p>Click the button to see the counter increase.</p>
    <p>
      Close the browser tab (or window), and try again, and the counter will
      continue to count (is not reset).
    </p>

    <script>
      function clickCounter() {
        let count = 0;
        const demo = document.getElementById("demo");

        if (localStorage.getItem("count")) {
          count = Number(localStorage.getItem("count"));
          count = count + 1;
        } else {
          count = 1;    
        }

        localStorage.setItem("count", count);
        demo.innerHTML = count;
      }
    </script>
  </body>
</html>
